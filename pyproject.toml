[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "termbridge"
version = "0.1.9"
description = "Browser-based terminal session workspace built on ttyd and tmux"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "TermBridge contributors" }]
keywords = ["terminal", "ttyd", "tmux", "fastapi", "vue", "workspace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Terminals",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "websockets>=14.0",
    "httpx>=0.28.0",
]

[project.scripts]
termbridge = "termbridge.main:main"

[tool.uv]
package = true

[tool.hatch.build.targets.sdist]
artifacts = ["src/termbridge/static/**"]

[tool.hatch.build.targets.wheel]
only-include = ["src/termbridge"]
sources = ["src"]
artifacts = ["src/termbridge/static/**"]

[dependency-groups]
dev = [
    "ruff>=0.15.17",
    "mypy>=2.1.0",
    "pytest>=9.0.2",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["termbridge"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
