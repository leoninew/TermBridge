[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "termbridge"
version = "0.1.3"
description = "Browser-based terminal session workspace built on ttyd and tmux"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
termbridge = "termbridge.main:main"

[tool.uv]
package = true

[tool.hatch.build.targets.sdist]
artifacts = ["src/termbridge/static/**"]

[tool.hatch.build.targets.wheel]
only-include = ["src/termbridge"]
sources = ["src"]
artifacts = ["src/termbridge/static/**"]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["termbridge"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
